<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LobeHub UI Replica</title>
    <style>
      body {
        margin: 0;
      }
      #boot {
        font:
          13px/1.6 ui-monospace,
          monospace;
        color: #888;
        padding: 24px;
      }
    </style>

    <!-- The prototype runtime: react + @lobehub/ui(+base-ui) + antd + antd-style +
     lucide-react, bundled from the real design system.
     Build both files next to this HTML:
       bash .agents/skills/design-prototype/scripts/build-runtime.sh <this-dir> -->
    <script src="./lobe-prototype-runtime.js"></script>
    <script>
      window.require = (name) => {
        const m = __PROTO_DEPS_NS__.default[name];
        if (!m)
          throw new Error(
            'prototype runtime is missing module: ' + name + ' — add it to entry.mjs and rebuild',
          );
        return m;
      };
      window.exports = {};
      window.module = { exports: window.exports };
    </script>
    <script src="./babel.min.js"></script>
  </head>

    <div id="boot">booting prototype runtime…</div>
    <div id="root"></div>

      //   home         src/routes/(main)/home/features/index.tsx
      //   chat         src/routes/(main)/agent/(chat)/_layout + features/Conversation
      //   settings     src/routes/(main)/settings/{_layout/Body,hooks/useCategory}
      //   community    src/routes/(main)/community/(list)/_layout
      //   tokens       DESIGN.md + DESIGN.dark.md

      // OUT OF SCOPE (deliberate cuts, not decisions):
      //   - i18n: copy is inlined in English (prototypes skip react-i18next).
      //   - Real data/stores: zustand + SWR are replaced by local useState.
      //   - createStaticStyles → createStyles (static extraction needs a build).
      //   - Mobile / popup / desktop-titlebar route trees.
      // =====================================================================

        AccordionItem,
        ActionIcon,

      // ===================================================================

      // ===================================================================
      // Primitives shared with the real app
      // ===================================================================

       */
      const PrototypeBar = memo(({ onChange, route, value }) => {
        const { styles, theme } = useStyles();
        return (
          <Flexbox
            horizontal
            align="center"
            className={styles.stateStrip}
            flex="none"

      const StateContext = React.createContext(() => {});

      const RowMenu = memo(({ items }) => (

        if (state === 'loading') return <LoadingState />;
        if (state === 'error')

                        borderBlockEnd:
                          i === files.length - 1
                            ? undefined
                            : `1px solid ${theme.colorBorderSecondary}`,
                      }}
                    >
                      <Flexbox horizontal align="center" gap={8} style={{ flex: 3, minWidth: 0 }}>
                        <Icon color={theme.colorTextTertiary} icon={FileText} size={16} />
                        <Text ellipsis>{f.name}</Text>
                      </Flexbox>
                      <Text fontSize={12} style={{ flex: 1 }} type="secondary">
                        {f.type}
                      </Text>
                      <Text className={styles.mono} style={{ flex: 1 }} type="secondary">
                        {f.chunks}
                      </Text>
                      <Text fontSize={12} style={{ flex: 1 }} type="secondary">
                        {f.size}
                      </Text>
                      <Text fontSize={12} style={{ flex: 1 }} type="secondary">
                        {f.time}
                      </Text>
                    </Flexbox>
                  ))}
                </Block>
              </StateBody>
            </Flexbox>
          </Flexbox>
        );
      });

      // ===================================================================
      // Screen — Memory
      // ===================================================================

      const MemoryScreen = memo(({ state }) => {
        const { styles, theme } = useStyles();
        return (
          <Flexbox className={styles.scroll} flex={1}>
            <Flexbox gap={24} padding={24} style={{ margin: '0 auto', maxWidth: 860, width: '100%' }}>
              <Flexbox gap={4}>
                <Text as="h1" fontSize={24} weight={600}>
                  Memory
                </Text>
                <Text type="secondary">
                  What your Agents remember about you. Edit or clear anything here — you own it.
                </Text>
              </Flexbox>

              <Alert
                message="Memory is on. Agents write here after a conversation ends."
                showIcon
                type="info"
                variant="filled"
              />

              <StateBody
                state={state}
                what="your memory"
                empty={
                  <Empty
                    description="Nothing remembered yet. After a few conversations, what matters will collect here — and you can clear it any time."
                    emoji="🧠"
                    title="No memories yet"
                  />
                }
              >
                <Flexbox gap={12}>
                  {MEMORIES.map((m) => (
                    <Block gap={8} key={m.body} padding={16} variant="outlined">
                      <Flexbox horizontal align="center" gap={8} justify="space-between">
                        <Tag size="small" variant="filled">
                          {m.kind}
                        </Tag>
                        <Flexbox horizontal align="center" gap={8}>
                          <Text color={theme.colorTextTertiary} fontSize={12}>
                            {m.time}
                          </Text>
                          <RowMenu />
                        </Flexbox>
                      </Flexbox>
                      <Text>{m.body}</Text>
                    </Block>
                  ))}
                </Flexbox>
              </StateBody>
            </Flexbox>
          </Flexbox>
        );
      });

      // ===================================================================
      // Screen — Pages
      // ===================================================================

      const PagesScreen = memo(({ state }) => {
        const { styles, theme } = useStyles();
        const [pages, setPages] = useState(PAGES);
        const addPage = () =>
          setPages((prev) => [
            { excerpt: 'Empty page — start writing.', time: 'just now', title: 'Untitled' },
            ...prev,
          ]);
        return (
          <Flexbox className={styles.scroll} flex={1}>
            <Flexbox gap={24} padding={24} style={{ margin: '0 auto', maxWidth: 860, width: '100%' }}>
              <Flexbox horizontal align="center" justify="space-between">
                <Flexbox gap={4}>
                  <Text as="h1" fontSize={24} weight={600}>
                    Pages
                  </Text>
                  <Text type="secondary">Documents you and your Agents write together.</Text>
                </Flexbox>
                <Button icon={PlusIcon} type="primary" onClick={addPage}>
                  New Page
                </Button>
              </Flexbox>

              <StateBody
                state={state}
                what="your pages"
                empty={
                  <Empty
                    action={
                      <Button icon={PlusIcon} type="primary" onClick={addPage}>
                        New Page
                      </Button>
                    }
                    description="Pages are documents an Agent can draft, edit and cite. Start one and it stays yours to edit."
                    emoji="📝"
                    title="No pages yet"
                  />
                }
              >
                <Flexbox gap={12}>
                  {pages.map((p) => (
                    <Block
                      className={styles.card}
                      clickable
                      gap={6}
                      key={p.title}
                      padding={16}
                      variant="outlined"
                    >
                      <Flexbox horizontal align="center" gap={8}>
                        <Icon color={theme.colorTextTertiary} icon={FilePenIcon} size={16} />
                        <Text weight={600}>{p.title}</Text>
                        <Text
                          color={theme.colorTextTertiary}
                          fontSize={12}
                          style={{ marginInlineStart: 'auto' }}
                        >
                          {p.time}
                        </Text>
                      </Flexbox>
                      <Text ellipsis fontSize={12} type="secondary">
                        {p.excerpt}
                      </Text>
                    </Block>
                  ))}
                </Flexbox>
              </StateBody>
            </Flexbox>
          </Flexbox>
        );
      });

      // ===================================================================
      // Screen — Tasks
      // ===================================================================

      const STATUS_TAG = {
        done: { color: 'success', label: 'Done' },
        failed: { color: 'error', label: 'Failed' },
        queued: { color: undefined, label: 'Queued' },
        running: { color: 'info', label: 'Running' },
      };

      const TasksScreen = memo(({ state }) => {
        const { styles, theme } = useStyles();
        return (
          <Flexbox className={styles.scroll} flex={1}>
            <Flexbox gap={24} padding={24} style={{ margin: '0 auto', maxWidth: 860, width: '100%' }}>
              <Flexbox gap={4}>
                <Text as="h1" fontSize={24} weight={600}>
                  Tasks
                </Text>
                <Text type="secondary">Long-running work your Agents are driving.</Text>
              </Flexbox>

              <StateBody
                state={state}
                what="your tasks"
                empty={
                  <Empty
                    description="No task is running. Ask an Agent for something that takes a while and it will show up here with live progress."
                    emoji="📋"
                    title="No tasks running"
                  />
                }
              >
                <Flexbox gap={12}>
                  {TASKS.map((t) => {
                    const tag = STATUS_TAG[t.status];
                    return (
                      <Block gap={12} key={t.title} padding={16} variant="outlined">
                        <Flexbox horizontal align="center" gap={12}>
                          <Flexbox flex={1} gap={4} style={{ minWidth: 0 }}>
                            <Text ellipsis weight={500}>
                              {t.title}
                            </Text>
                            <Text color={theme.colorTextTertiary} fontSize={12}>
                              {t.agent}
                            </Text>
                          </Flexbox>
                          <Tag color={tag.color} size="small" variant="filled">
                            {tag.label}
                          </Tag>
                        </Flexbox>
                        {t.status === 'failed' ? (
                          <Flexbox horizontal align="center" gap={8}>
                            <Icon color={theme.colorError} icon={CircleAlert} size={14} />
                            <Text fontSize={12} type="danger" style={{ flex: 1 }}>
                              Step 3 timed out. Nothing was written.
                            </Text>
                            <Button icon={RefreshCwIcon} size="small">
                              Retry
                            </Button>
                          </Flexbox>
                        ) : (
                          <Progress
                            percent={t.progress}
                            size="small"
                            status={t.status === 'done' ? 'success' : 'active'}
                            strokeColor={t.status === 'done' ? theme.colorSuccess : theme.colorPrimary}
                          />
                        )}
                      </Block>
                    );
                  })}
                </Flexbox>
              </StateBody>
            </Flexbox>
          </Flexbox>
        );
      });

      // ===================================================================
      // Screen — Settings (Appearance shown as the representative form)
      // ===================================================================

      const SettingRow = memo(({ children, desc, label }) => {
        const { theme } = useStyles();
        return (
          <Flexbox
            horizontal
            align="center"
            gap={24}
            justify="space-between"
            paddingBlock={16}
            style={{ borderBlockEnd: `1px solid ${theme.colorBorderSecondary}` }}
          >
            <Flexbox gap={2} style={{ minWidth: 0 }}>
              <Text>{label}</Text>
              {desc && (
                <Text color={theme.colorTextTertiary} fontSize={12}>
                  {desc}
                </Text>
              )}
            </Flexbox>
            <Flexbox flex="none">{children}</Flexbox>
          </Flexbox>
        );
      });

      const SettingsScreen = memo(({ state, tab }) => {
        const { styles, theme } = useStyles();
        const label =
          SETTINGS_GROUPS.flatMap((g) => g.items).find((i) => i.key === tab)?.label ?? 'Settings';
        const [themeMode, setThemeMode] = useState('auto');
        const [density, setDensity] = useState('comfortable');
        const [primary, setPrimary] = useState('#222');
        const [msgStyle, setMsgStyle] = useState('chat');
        const [msgFontSize, setMsgFontSize] = useState(14);

        return (
          <Flexbox className={styles.scroll} flex={1}>
            <Flexbox gap={24} padding={24} style={{ margin: '0 auto', maxWidth: 760, width: '100%' }}>
              <Text as="h1" fontSize={24} weight={600}>
                {label}
              </Text>

              <StateBody
                state={state}
                what="your settings"
                empty={
                  <Empty
                    description="This section has nothing to configure on your plan."
                    emoji="⚙️"
                    title="Nothing to configure"
                  />
                }
              >
                {tab === 'appearance' ? (
                  <Flexbox gap={32}>
                    <Flexbox gap={0}>
                      <SectionLabel>Theme</SectionLabel>
                      <SettingRow
                        desc="Auto follows your operating system."
                        label="Appearance"
                      >
                        <Segmented
                          options={[
                            { label: 'Auto', value: 'auto' },
                            { label: 'Light', value: 'light' },
                            { label: 'Dark', value: 'dark' },
                          ]}
                          value={themeMode}
                          onChange={(v) => setThemeMode(String(v))}
                        />
                      </SettingRow>
                      <SettingRow
                        desc="Monochrome by default — a hue only appears when you pick one."
                        label="Primary color"
                      >
                        <Flexbox horizontal gap={6}>
                          {['#222', '#ec5e41', '#ee9e0b', '#379d4a', '#0072f5', '#8b5cf6'].map(
                            (c) => (
                              <button
                                aria-label={`Primary color ${c}`}
                                aria-pressed={primary === c}
                                key={c}
                                type="button"
                                onClick={() => setPrimary(c)}
                                style={{
                                  background: c,
                                  border:
                                    primary === c
                                      ? `2px solid ${theme.colorText}`
                                      : `1px solid ${theme.colorBorder}`,
                                  borderRadius: 9999,
                                  cursor: 'pointer',
                                  height: 22,
                                  padding: 0,
                                  width: 22,
                                }}
                              />
                            ),
                          )}
                        </Flexbox>
                      </SettingRow>
                      <SettingRow desc="Row height across lists and menus." label="Density">
                        <Segmented
                          options={[
                            { label: 'Compact', value: 'compact' },
                            { label: 'Comfortable', value: 'comfortable' },
                          ]}
                          value={density}
                          onChange={(v) => setDensity(String(v))}
                        />
                      </SettingRow>
                    </Flexbox>

                    <Flexbox gap={0}>
                      <SectionLabel>Chat</SectionLabel>
                      <SettingRow desc="Bubble or document layout." label="Message style">
                        <Segmented
                          options={[
                            { label: 'Chat', value: 'chat' },
                            { label: 'Docs', value: 'docs' },
                          ]}
                          value={msgStyle}
                          onChange={(v) => setMsgStyle(String(v))}
                        />
                      </SettingRow>
                      <SettingRow desc="Applies to message text only." label="Font size">
                        <Segmented
                          options={[
                            { label: '12', value: 12 },
                            { label: '14', value: 14 },
                            { label: '16', value: 16 },
                          ]}
                          value={msgFontSize}
                          onChange={(v) => setMsgFontSize(Number(v))}
                        />
                      </SettingRow>
                      <Flexbox paddingBlock={16}>
                        <Block gap={8} padding={16} variant="filled">
                          <Text color={theme.colorTextTertiary} fontSize={12}>
                            Preview
                          </Text>
                          <Flexbox
                            paddingBlock={msgStyle === 'chat' ? 10 : 0}
                            paddingInline={msgStyle === 'chat' ? 16 : 0}
                            style={
                              msgStyle === 'chat'
                                ? {
                                    alignSelf: 'flex-start',
                                    background: theme.colorBgContainer,
                                    borderRadius: theme.borderRadiusLG,
                                  }
                                : undefined
                            }
                          >
                            <Text fontSize={msgFontSize}>
                              Message text renders at {msgFontSize}px in {msgStyle} layout.
                            </Text>
                          </Flexbox>
                        </Block>
                      </Flexbox>
                    </Flexbox>
                  </Flexbox>
                ) : (
                  <Empty
                    description={`“${label}” is not part of this prototype — Appearance is the representative form. Every settings page uses the same header + grouped-row layout.`}
                    emoji="🧩"
                    title="Not in this prototype"
                  />
                )}
              </StateBody>
            </Flexbox>
          </Flexbox>
        );
      });

      // ===================================================================
      // Screen — Design tokens (the extraction itself, made visible)
      // ===================================================================

      const TokensScreen = memo(() => {
        const { styles, theme } = useStyles();
        return (
          <Flexbox className={styles.scroll} flex={1}>
            <Flexbox gap={32} padding={24} style={{ margin: '0 auto', maxWidth: 980, width: '100%' }}>
              <Flexbox gap={4}>
                <Text as="h1" fontSize={24} weight={600}>
                  Design tokens
                </Text>
                <Text type="secondary">
                  Live values read from the running theme. Swatches change with your OS appearance —
                  this is the real contract, not a screenshot of it.
                </Text>
              </Flexbox>

              {TOKEN_GROUPS.map((group) => (
                <Flexbox gap={12} key={group.title}>
                  <SectionLabel>{group.title}</SectionLabel>
                  <Grid gap={12} maxItemWidth={300} rows={2}>
                    {group.rows.map(([name, tokenKey, desc]) => (
                      <Flexbox horizontal align="center" gap={12} key={name}>
                        <div
                          className={styles.swatch}
                          style={{ background: theme[tokenKey], flex: 'none' }}
                        />
                        <Flexbox gap={2} style={{ minWidth: 0 }}>
                          <Text className={styles.mono} ellipsis>
                            {name}
                          </Text>
                          <Text color={theme.colorTextTertiary} ellipsis fontSize={12}>
                            {desc}
                          </Text>
                        </Flexbox>
                      </Flexbox>
                    ))}
                  </Grid>
                </Flexbox>
              ))}

              <Flexbox gap={12}>
                <SectionLabel>Typography</SectionLabel>
                <Block gap={12} padding={16} variant="outlined">
                  {[
                    ['fontSizeHeading1', 38],
                    ['fontSizeHeading3', 24],
                    ['fontSizeLG', 16],
                    ['fontSize', 14],
                    ['fontSizeSM', 12],
                  ].map(([name, size]) => (
                    <Flexbox horizontal align="baseline" gap={16} key={name}>
                      <Text className={styles.mono} style={{ flex: 'none', width: 170 }} type="secondary">
                        {name}
                      </Text>
                      <Text fontSize={size} weight={size >= 24 ? 600 : undefined}>
                        The quick brown fox — {size}px
                      </Text>
                    </Flexbox>
                  ))}
                </Block>
              </Flexbox>

              <Flexbox gap={12}>
                <SectionLabel>Radius & control heights</SectionLabel>
                <Flexbox horizontal gap={24} wrap="wrap">
                  {[
                    ['borderRadiusXS', 4, 'tags, chips'],
                    ['borderRadiusSM', 6, 'inputs'],
                    ['borderRadius', 8, 'buttons, cards'],
                    ['borderRadiusLG', 12, 'menus, modals'],
                  ].map(([name, r, use]) => (
                    <Flexbox align="center" gap={6} key={name}>
                      <div
                        style={{
                          background: theme.colorFillSecondary,
                          border: `1px solid ${theme.colorBorderSecondary}`,
                          borderRadius: r,
                          height: 56,
                          width: 56,
                        }}
                      />
                      <Text className={styles.mono} fontSize={12}>
                        {r}px
                      </Text>
                      <Text color={theme.colorTextTertiary} fontSize={12}>
                        {use}
                      </Text>
                    </Flexbox>
                  ))}
                </Flexbox>
                <Flexbox horizontal align="center" gap={12}>
                  <Button size="small">28 · SM</Button>
                  <Button>36 · default</Button>
                  <Button size="large">40 · LG</Button>
                </Flexbox>
              </Flexbox>

              <Flexbox gap={12}>
                <SectionLabel>Elevation</SectionLabel>
                <Flexbox horizontal gap={24} wrap="wrap">
                  {[
                    ['boxShadowTertiary', 'raised cards'],
                    ['boxShadowSecondary', 'popovers, menus'],
                    ['boxShadow', 'modals, dialogs'],
                  ].map(([name, use]) => (
                    <Flexbox align="center" gap={8} key={name} style={{ padding: 8 }}>
                      <div
                        style={{
                          background: theme.colorBgElevated,
                          borderRadius: theme.borderRadiusLG,
                          boxShadow: theme[name],
                          height: 56,
                          width: 96,
                        }}
                      />
                      <Text className={styles.mono} fontSize={12}>
                        {name}
                      </Text>
                      <Text color={theme.colorTextTertiary} fontSize={12}>
                        {use}
                      </Text>
                    </Flexbox>
                  ))}
                </Flexbox>
              </Flexbox>

              <Flexbox gap={12} style={{ paddingBottom: 40 }}>
                <SectionLabel>Buttons & tags</SectionLabel>
                <Flexbox horizontal gap={8} wrap="wrap">
                  <Button type="primary">Create Agent</Button>
                  <Button>View details</Button>
                  <Button type="text">Dismiss</Button>
                  <Button danger>Delete Session</Button>
                  <Button disabled>Disabled</Button>
                </Flexbox>
                <Flexbox horizontal gap={8} wrap="wrap">
                  <Tag>default</Tag>
                  <Tag color="success">success</Tag>
                  <Tag color="warning">warning</Tag>
                  <Tag color="error">error</Tag>
                  <Tag color="info">info</Tag>
                </Flexbox>
              </Flexbox>
            </Flexbox>
          </Flexbox>
        );
      });

      // ===================================================================
      // App shell
      // ===================================================================

      const ROUTE_TITLE = {
        chat: 'Chat',
        community: 'Community',
        home: 'Home',
        image: 'Generation',
        memory: 'Memory',
        pages: 'Pages',
        resource: 'Resource',
        search: 'Search',
        settings: 'Settings',
        tasks: 'Tasks',
        tokens: 'Design tokens',
      };

      const App = memo(() => {
        const { styles, theme } = useStyles();
        const [route, setRoute] = useState('home');
        const [agentId, setAgentId] = useState('code');
        const [settingsTab, setSettingsTab] = useState('appearance');
        const [state, setState] = useState('data');
        const [expand, setExpand] = useState(true);

        const agent = AGENTS.find((a) => a.id === agentId) ?? AGENTS[0];

        const sidebar =
          route === 'settings' ? (
            <SettingsSidebar
              tab={settingsTab}
              onBack={() => setRoute('home')}
              onTab={setSettingsTab}
            />
          ) : route === 'chat' ? (
            <ChatSidebar agentId={agentId} onAgent={setAgentId} onRoute={setRoute} />
          ) : (
            <HomeSidebar
              agentId={agentId}
              route={route}
              onAgent={setAgentId}
              onRoute={setRoute}
            />
          );

        const header = (() => {
          if (route === 'chat')
            return {
              left: (
                <Flexbox horizontal align="center" gap={4} style={{ minWidth: 0 }}>
                  <Tag size="small" variant="filled">
                    Claude Opus 5
                  </Tag>
                  <Tag size="small" variant="filled">
                    3 tools
                  </Tag>
                  <Tag size="small" variant="filled">
                    Memory on
                  </Tag>
                </Flexbox>
              ),
              right: (
                <>
                  <ActionIcon icon={Share2Icon} size="small" title="Share" />
                  <RowMenu />
                </>
              ),
            };
          if (route === 'home')
            return {
              left: null,
              right: (
                <>
                  <ActionIcon icon={SearchIcon} size="small" title="Search" />
                  <ActionIcon icon={SettingsIcon} size="small" title="Settings" onClick={() => setRoute('settings')} />
                </>
              ),
            };
          return {
            left: (
              <Text ellipsis weight={500}>
                {ROUTE_TITLE[route] ?? ''}
              </Text>
            ),
            right: <RowMenu />,
          };
        })();

        const screen = (() => {
          switch (route) {
            case 'chat': {
              return <ChatScreen agentId={agentId} state={state} />;
            }
            case 'community': {
              return <CommunityScreen state={state} />;
            }
            case 'resource': {
              return <ResourceScreen state={state} />;
            }
            case 'memory': {
              return <MemoryScreen state={state} />;
            }
            case 'pages': {
              return <PagesScreen state={state} />;
            }
            case 'tasks': {
              return <TasksScreen state={state} />;
            }
            case 'settings': {
              return <SettingsScreen state={state} tab={settingsTab} />;
            }
            case 'tokens': {
              return <TokensScreen />;
            }
            // `search` opens the command palette in the real app and
            // `image` is the generation surface — both are cuts here.
            case 'search':
            case 'image': {
              return (
                <Center flex={1} padding={48}>
                  <Empty
                    action={<Button onClick={() => setRoute('home')}>Back to Home</Button>}
                    description={
                      route === 'search'
                        ? 'Search opens the ⌘K command palette in the real app. Not wired in this prototype.'
                        : 'The image / video generation surface is out of scope for this prototype.'
                    }
                    emoji="🚧"
                    title="Not in this prototype"
                  />
                </Center>
              );
            }
            default: {
              return (
                <HomeScreen
                  agentId={agentId}
                  state={state}
                  onAgent={setAgentId}
                  onRoute={setRoute}
                />
              );
            }
          }
        })();

        return (
          <StateContext value={setState}>
          <Flexbox className={styles.shell} width="100%">
            <PrototypeBar route={route} value={state} onChange={setState} />
            <Flexbox horizontal flex={1} style={{ minHeight: 0 }} width="100%">
            <DraggablePanel
              className={styles.panel}
              defaultSize={{ height: '100%', width: 280 }}
              expand={expand}
              expandable={false}
              maxWidth={400}
              minWidth={240}
              placement="left"
              showBorder={false}
              style={{ background: theme.colorBgLayout, zIndex: 11 }}
              onExpandChange={setExpand}
            >
              <TooltipGroup>{sidebar}</TooltipGroup>
            </DraggablePanel>

            <Flexbox className={styles.content} flex={1}>
              <NavHeader
                collapsed={!expand}
                left={header.left}
                right={header.right}
                onExpand={() => setExpand(true)}
              />
              {screen}
            </Flexbox>
            </Flexbox>
          </Flexbox>
          </StateContext>
        );
      });

      document.querySelector('#boot').remove();
      createRoot(document.querySelector('#root')).render(
        <ThemeProvider theme={{ cssVar: { key: 'lobe-vars' } }} themeMode="auto">
          <ConfigProvider motion={m}>
            <App />
          </ConfigProvider>
        </ThemeProvider>,
      );
    </script>
  </body>
</html>
